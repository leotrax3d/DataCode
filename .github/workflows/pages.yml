name: Deploy to GitHub Pages

# Deployt nur vom Default-Branch (main). Die automatisch angelegte
# Umgebung "github-pages" erlaubt Deployments standardmäßig nur von main,
# daher würde ein Lauf vom Feature-Branch an der Schutzregel scheitern.
# Nach dem Merge dieses PRs in main veröffentlicht dieser Workflow die Seite.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
